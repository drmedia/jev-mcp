# Runs the jev-mcp Streamable HTTP server in Docker on this machine only.
# Start: docker compose up -d --build    Stop: docker compose down
# Clients connect to http://127.0.0.1:8098/mcp with Authorization: Bearer <JEV_HTTP_TOKEN>.
services:
  jev-mcp:
    build: .
    image: jev-mcp:local
    container_name: jev-mcp
    # Provider keys, JEV_MODEL and JEV_HTTP_TOKEN come from .env at run time.
    env_file:
      - path: .env
        required: true
    # These override .env (Compose gives `environment` precedence).
    environment:
      JEV_HTTP_HOST: "0.0.0.0"
      PORT: "8098"
      # Windows paths in .env do not exist in the container; see the volume example below.
      JEV_IMAGE_DIRS: ""
      # 127.0.0.1 inside the container is the container itself. Docker Desktop forwards
      # host.docker.internal to the host's loopback, so a local server such as
      # llama-server can stay bound to 127.0.0.1 on the host.
      JEV_LOCAL_BASE_URL: "http://host.docker.internal:8097"
    ports:
      # Published on the host's loopback address only; keep both port numbers equal,
      # because the server checks that the Host header carries its own port.
      - "127.0.0.1:8098:8098"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # To judge local image files by path, mount a folder read-only and point
    # JEV_IMAGE_DIRS at it, for example:
    # volumes:
    #   - D:/photos:/images:ro
    # and set JEV_IMAGE_DIRS: "/images" above.
